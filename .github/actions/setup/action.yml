name: Set up pnpm, Node and dependencies
description: >-
  Installs pnpm from the packageManager pin, Node from .nvmrc, and the
  workspace dependencies from the lockfile. The repository must already be
  checked out — a local composite action cannot check out the repository that
  contains it, so every job runs actions/checkout first.

runs:
  using: composite
  steps:
    # No `version:` input on purpose: pnpm/action-setup reads the exact version
    # from the `packageManager` field in package.json, so the pin lives in one
    # place. It has to run before setup-node, which asks pnpm where its store is.
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        # Only the `e2e` job runs Cypress, and it restores the binary from its
        # own cache and installs it explicitly. Every other job would otherwise
        # pay for a several-hundred-megabyte download it never opens.
        CYPRESS_INSTALL_BINARY: '0'
