# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # TypeScript 7 is the Go compiler with a new API. `eslint-config-next`
      # pins typescript-eslint, whose peer range stops at 6.x and which crashes
      # at load time on 7 (`Cannot read properties of undefined (reading
      # 'Cjs')`), so the bump fails `lint-and-typecheck` on every run. Lift this
      # once typescript-eslint supports 7 and Next has picked that release up.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Same shape: `eslint-plugin-react` under `eslint-config-next` still calls
      # `context.getFilename()`, which ESLint 10 removed, so ESLint 10 crashes
      # on the first rule it loads. Lift this once eslint-config-next moves.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
    groups:
      # These four are one moving part. `eslint-config-next` is pinned to the
      # exact `next` version, and the OpenNext adapter is written against a
      # specific Next.js output shape and a specific wrangler CLI — bumping any
      # of them alone produces a PR that cannot pass CI.
      next-platform:
        patterns:
          - next
          - eslint-config-next
          - '@opennextjs/*'
          - wrangler
      # React and its type packages are a version pair; a runtime bumped
      # without its @types drags a typecheck failure behind it.
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      # react-i18next tracks i18next's major, so the two travel together.
      i18next:
        patterns:
          - i18next
          - react-i18next
      # Everything else that only runs on a developer's machine or in CI: test
      # runners, linters, the Tailwind toolchain. One PR a week rather than a
      # dozen. A dependency joins the first group it matches, so the type
      # packages above are already spoken for — the excludes are belt and
      # braces for a reader skimming this file.
      dev-tooling:
        dependency-type: development
        patterns:
          - '*'
        exclude-patterns:
          - eslint-config-next
          - '@opennextjs/*'
          - wrangler
          - '@types/react'
          - '@types/react-dom'

  - package-ecosystem: github-actions
    # The workflows and the composite action under .github/actions each need
    # their own directory entry; Dependabot does not walk the tree.
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
