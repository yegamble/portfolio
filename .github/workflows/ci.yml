name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_version_id:
        description: >-
          Cloudflare Worker version id to roll production back to (from
          `wrangler versions list`, or the id recorded in a previous deploy's
          job summary). Leave empty to run the pipeline normally.
        required: false
        default: ''

# The default GITHUB_TOKEN permissions are whatever the repository grants.
# Nothing here writes to the repository, so read is the whole budget; the
# deploy job authenticates to Cloudflare with its own secrets instead.
permissions:
  contents: read

# One run per ref. Superseded pull request runs are cancelled outright; runs on
# main are queued rather than cancelled, so a merge never loses its deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job ids are the names branch protection matches on, so `lint-and-typecheck`,
# `unit-tests` and `build` keep the names they already report under. `e2e` and
# `playwright` are new checks and have to be added to the rule by hand.
jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A rollback dispatch is an incident response. It does not wait for tests.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.rollback_version_id == '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.rollback_version_id == '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Unit tests with coverage
        run: |
          set -o pipefail
          pnpm test:coverage 2>&1 | tee "$RUNNER_TEMP/coverage.log"

      - name: Publish coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Unit test coverage'
            echo
            echo '```'
            if grep -q 'Coverage summary' "$RUNNER_TEMP/coverage.log"; then
              awk '/Coverage summary/ { found = 1 } found' "$RUNNER_TEMP/coverage.log"
            else
              echo 'No coverage summary was produced.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Blocking at `critical` only, deliberately. The three advisories open
      # today (2 high, 1 low) are all transitive under
      # next > styled-jsx > @babel/core with no upstream release to move to, so
      # a `high` gate would fail every run without anyone being able to fix it.
      # The informational step below keeps them visible in the log.
      - name: Audit production dependencies (blocking)
        run: pnpm audit --prod --audit-level=critical

      - name: Audit production dependencies (informational)
        continue-on-error: true
        run: pnpm audit --prod

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.rollback_version_id == '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Set up environment
        run: cp .env.example .env

      - name: Build
        run: pnpm build

      # Both browser suites run against this exact build rather than compiling
      # their own, so they test the artifact that ships. `.next/cache` is
      # Next.js's local compiler cache and is worthless to a downloader.
      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # The shared setup installs dependencies with CYPRESS_INSTALL_BINARY=0, so
      # this is the only place the binary is fetched. `cypress install` is a
      # no-op when the cache already holds the right version.
      - name: Cache Cypress binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: next-build
          path: .next

      - name: Set up environment
        run: cp .env.example .env

      # `install: false` because the shared setup already installed everything;
      # the action's own install path would find the lockfile satisfied, skip
      # cypress's postinstall, and then fail its binary verification.
      # `/en` rather than `/` — the proxy answers `/` with a redirect, which
      # wait-on would accept before the app can actually render a page.
      - name: Run Cypress
        uses: cypress-io/github-action@09090944bd8aaa2a517cefb6e38bf1aae336b42b # v7.4.3
        with:
          install: false
          start: pnpm start
          wait-on: http://localhost:3000/en
          wait-on-timeout: 90
          browser: chrome

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: next-build
          path: .next

      - name: Set up environment
        run: cp .env.example .env

      # playwright.config.ts starts `next start` (not `next dev`) when CI is
      # set, so the frame-rate and layout numbers come from the production
      # bundle these specs were tuned against.
      - name: Run Playwright specs
        run: pnpm test:playwright

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-typecheck, unit-tests, build, e2e, playwright]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment:
      name: Production
      url: https://yosefgamble.com
    # Not keyed on the ref: two merges to main must not deploy at once. The
    # older run finishing last is how production went backwards on 2026-08-16.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    outputs:
      version-id: ${{ steps.deploy.outputs.version-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Set up environment
        run: cp .env.example .env

      - name: Deploy to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm run deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"

          # The version id is the only handle `wrangler rollback` accepts, and
          # the deploy log is the only place it is printed.
          version_id="$(
            sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' "$RUNNER_TEMP/deploy.log" \
              | grep -iE 'current version id:' \
              | tail -n 1 \
              | sed -E 's/.*[Cc]urrent [Vv]ersion [Ii][Dd]:[[:space:]]*//' \
              | tr -d '[:space:]'
          )"
          echo "version-id=$version_id" >> "$GITHUB_OUTPUT"

          {
            echo '### Deployed to production'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            if [ -n "$version_id" ]; then
              echo "- Worker version id: \`${version_id}\`"
              echo
              echo 'To roll back, run this workflow from the Actions tab with'
              echo '`rollback_version_id` set to the id of a **previous** deploy.'
            else
              echo '- Worker version id: not found in the deploy output'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test production
        run: |
          set -uo pipefail
          BASE=https://yosefgamble.com

          smoke() {
            local status headers_file="$RUNNER_TEMP/en.headers"

            status="$(curl -sS -o /dev/null -D "$headers_file" -w '%{http_code}' \
              --max-time 20 "$BASE/en")" || return 1
            [ "$status" = "200" ] || { echo "  /en returned $status"; return 1; }
            grep -qi '^strict-transport-security:' "$headers_file" \
              || { echo '  /en has no Strict-Transport-Security header'; return 1; }
            grep -qi '^content-security-policy:' "$headers_file" \
              || { echo '  /en has no Content-Security-Policy header'; return 1; }

            curl -sS --max-time 20 "$BASE/he" | grep -q 'dir="rtl"' \
              || { echo '  /he did not render dir="rtl"'; return 1; }

            local redirect
            redirect="$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' \
              --max-time 20 "$BASE/")" || return 1
            [ "$redirect" = "307 $BASE/en" ] \
              || { echo "  / returned '$redirect', expected '307 $BASE/en'"; return 1; }
          }

          for attempt in 1 2 3 4 5; do
            echo "Smoke test attempt $attempt"
            if smoke; then
              echo "Production is healthy."
              echo '### Smoke test passed' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 15
            fi
          done

          echo "::error::Production smoke test failed after 5 attempts."
          {
            echo '### Smoke test FAILED'
            echo
            echo "Roll back by re-running this workflow with \`rollback_version_id\`"
            echo 'set to the version id of the previous deploy.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_version_id != '' }}
    environment:
      name: Production
      url: https://yosefgamble.com
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # The input reaches the shell through the environment, never through
      # string interpolation into the script.
      - name: Roll back the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_VERSION_ID: ${{ inputs.rollback_version_id }}
          TRIGGERED_BY: ${{ github.actor }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$ROLLBACK_VERSION_ID" \
            | grep -qE '^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$'; then
            echo "::error::'$ROLLBACK_VERSION_ID' is not a Worker version id."
            exit 1
          fi

          pnpm exec wrangler rollback "$ROLLBACK_VERSION_ID" -y \
            --message "manual rollback by $TRIGGERED_BY"

          {
            echo '### Rolled back'
            echo
            echo "- Worker version id: \`${ROLLBACK_VERSION_ID}\`"
            echo "- Triggered by: @${TRIGGERED_BY}"
          } >> "$GITHUB_STEP_SUMMARY"
